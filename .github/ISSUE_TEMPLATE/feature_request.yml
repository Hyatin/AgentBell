name: Feature request
description: Suggest a focused improvement consistent with AgentBell's local-first scope
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user need without private payloads or pairing material.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Note any new network exposure, stored data, permissions, or dependencies.
    validations:
      required: true
