name: Bug report
description: Report a reproducible AgentBell problem using synthetic, sanitized data
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never upload a Token, pairing URL/QR, config.json, events.json, complete hooks.json, raw log, full diagnostic ZIP, prompt, or response body. A manually reviewed sanitized diagnostic summary is acceptable.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Windows Setup, Windows Tray, Codex Hook, Android app, Documentation, Build]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AgentBell version
      placeholder: 0.5.0-beta.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction with synthetic data
      description: Remove paths, IPs, IDs, messages, and all pairing material.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed this report and removed all prohibited private data listed above.
          required: true
