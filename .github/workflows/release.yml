name: Guarded public beta release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v prefix
        required: true
        default: 0.7.0-beta.1
      dry_run:
        description: Build and validate without creating a GitHub Release
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build verified release assets
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.AGENTBELL_RELEASE_ENABLED == 'true')
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - name: Checkout clean source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize release paths
        shell: pwsh
        run: |
          $releaseTemp = Join-Path $env:RUNNER_TEMP 'agentbell-release'
          $codexHome = Join-Path $releaseTemp 'codex-home'
          $dataHome = Join-Path $releaseTemp 'data-home'
          $keystorePath = Join-Path $releaseTemp 'agentbell-release.jks'
          $certificatePath = Join-Path $releaseTemp 'agentbell-signing.pfx'

          New-Item -ItemType Directory -Path @($releaseTemp, $codexHome, $dataHome) -Force | Out-Null

          @(
            "AGENTBELL_RELEASE_TEMP=$releaseTemp"
            "CODEX_HOME=$codexHome"
            "AGENTBELL_DATA_HOME=$dataHome"
            "AGENTBELL_ANDROID_KEYSTORE=$keystorePath"
            "AGENTBELL_WINDOWS_SIGN_CERTIFICATE=$certificatePath"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Setup JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
      - name: Validate tag and release metadata
        id: metadata
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'push') {
            '${{ github.ref_name }}'.Substring(1)
          } else {
            '${{ inputs.version }}'
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-beta\.\d+)?$') { throw 'Invalid release version.' }
          $expected = Select-String -Path Directory.Build.props -Pattern '<AgentBellInformationalVersion>([^<]+)<'
          if ($expected.Matches[0].Groups[1].Value -cne $version) { throw 'Tag/input does not match central version.' }
          $dryRun = '${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.dry_run }}' -eq 'true'
          $publish = -not $dryRun -and '${{ vars.AGENTBELL_RELEASE_ENABLED }}' -eq 'true'
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Materialize signing files in runner temp
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.AGENTBELL_ANDROID_KEYSTORE_BASE64 }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.AGENTBELL_WINDOWS_SIGN_CERTIFICATE_BASE64 }}
        run: |
          New-Item -ItemType Directory -Path $env:CODEX_HOME,$env:AGENTBELL_DATA_HOME -Force | Out-Null
          if (-not [string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) {
            [IO.File]::WriteAllBytes(
              $env:AGENTBELL_ANDROID_KEYSTORE,
              [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          }
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            [IO.File]::WriteAllBytes(
              $env:AGENTBELL_WINDOWS_SIGN_CERTIFICATE,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          }
      - name: Build and validate assets
        shell: pwsh
        env:
          AGENTBELL_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.AGENTBELL_ANDROID_KEYSTORE_PASSWORD }}
          AGENTBELL_ANDROID_KEY_ALIAS: ${{ secrets.AGENTBELL_ANDROID_KEY_ALIAS }}
          AGENTBELL_ANDROID_KEY_PASSWORD: ${{ secrets.AGENTBELL_ANDROID_KEY_PASSWORD }}
          AGENTBELL_WINDOWS_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.AGENTBELL_WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          AGENTBELL_WINDOWS_TIMESTAMP_URL: ${{ vars.AGENTBELL_WINDOWS_TIMESTAMP_URL }}
        run: |
          $publish = [System.Convert]::ToBoolean('${{ steps.metadata.outputs.publish }}')
          $buildArguments = @{
            Version = '${{ steps.metadata.outputs.version }}'
            Clean = $true
            DryRun = -not $publish
          }

          & .\scripts\build-release.ps1 @buildArguments
          if ($LASTEXITCODE -ne 0) {
            throw "Release build failed with exit code $LASTEXITCODE."
          }
      - name: Upload verified staging artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentbell-release-${{ steps.metadata.outputs.version }}
          path: artifacts/release/v${{ steps.metadata.outputs.version }}/
          if-no-files-found: error
          retention-days: 7
      - name: Delete temporary signing files
        if: always()
        shell: pwsh
        run: |
          foreach ($path in @(
            $env:AGENTBELL_ANDROID_KEYSTORE,
            $env:AGENTBELL_WINDOWS_SIGN_CERTIFICATE
          )) {
            if (-not [string]::IsNullOrWhiteSpace($path) -and
              (Test-Path -LiteralPath $path -PathType Leaf)) {
              Remove-Item -LiteralPath $path -Force
            }
          }

  provenance:
    name: Optional GitHub artifact attestation
    needs: build
    if: >-
      needs.build.result == 'success' && needs.build.outputs.publish == 'true' &&
      vars.AGENTBELL_ATTESTATIONS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agentbell-release-${{ needs.build.outputs.version }}
          path: release-assets
      - name: Attest Setup and APK provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            release-assets/AgentBell-Setup-${{ needs.build.outputs.version }}.exe
            release-assets/AgentBell-Android-${{ needs.build.outputs.version }}.apk

  publish:
    name: Publish draft-first GitHub pre-release
    needs: [build, provenance]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      needs.build.outputs.publish == 'true' &&
      (needs.provenance.result == 'success' || needs.provenance.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout tag metadata without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agentbell-release-${{ needs.build.outputs.version }}
          path: release-assets
      - name: Assert public asset whitelist
        shell: bash
        run: |
          set -euo pipefail
          test -s "release-assets/AgentBell-Setup-${{ needs.build.outputs.version }}.exe"
          test -s "release-assets/AgentBell-Android-${{ needs.build.outputs.version }}.apk"
          test -s "release-assets/SHA256SUMS.txt"
          mapfile -t public_assets < <(
            find release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          expected_assets=(
            "AgentBell-Android-${{ needs.build.outputs.version }}.apk"
            "AgentBell-Setup-${{ needs.build.outputs.version }}.exe"
            "RELEASE_NOTES.md"
            "SBOM.spdx.json"
            "SHA256SUMS.txt"
            "release-manifest.json"
          )
          mapfile -t expected_assets < <(printf '%s\n' "${expected_assets[@]}" | LC_ALL=C sort)
          [[ "$(printf '%s\n' "${public_assets[@]}")" == "$(printf '%s\n' "${expected_assets[@]}")" ]]
      - name: Verify existing release or publish a new draft-first prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: v${{ needs.build.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          readonly expected_name="AgentBell ${TAG#v}"
          readonly expected_assets=(
            "AgentBell-Android-${TAG#v}.apk"
            "AgentBell-Setup-${TAG#v}.exe"
            "SHA256SUMS.txt"
          )

          fail_release_state() {
            echo "Release verification failed: $1" >&2
            exit 1
          }

          verify_asset_names() {
            local release_json="$1"
            mapfile -t actual_assets < <(
              jq -r '.assets[].name' <<<"$release_json" | LC_ALL=C sort)
            mapfile -t sorted_expected < <(
              printf '%s\n' "${expected_assets[@]}" | LC_ALL=C sort)
            if [[ "${#actual_assets[@]}" -ne "${#sorted_expected[@]}" ]] ||
               [[ "$(printf '%s\n' "${actual_assets[@]}")" != "$(printf '%s\n' "${sorted_expected[@]}")" ]]; then
              fail_release_state "asset whitelist mismatch"
            fi
          }

          verify_release() {
            local release_json="$1"
            local tag_name release_name target_commitish draft prerelease
            tag_name=$(jq -r '.tag_name' <<<"$release_json")
            release_name=$(jq -r '.name' <<<"$release_json")
            target_commitish=$(jq -r '.target_commitish' <<<"$release_json")
            draft=$(jq -r '.draft' <<<"$release_json")
            prerelease=$(jq -r '.prerelease' <<<"$release_json")

            [[ "$tag_name" == "$TAG" ]] || fail_release_state "tag mismatch"
            [[ "$release_name" == "$expected_name" ]] || fail_release_state "release name mismatch"
            [[ "$draft" == "false" ]] || fail_release_state "existing release is unexpectedly a draft"
            [[ "$prerelease" == "true" ]] || fail_release_state "existing release is not a prerelease"
            if [[ "$target_commitish" != "main" &&
                  "$target_commitish" != "$TARGET_SHA" &&
                  "$target_commitish" != "$tag_sha" ]]; then
              fail_release_state "release target mismatch"
            fi
            verify_asset_names "$release_json"
          }

          git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null ||
            fail_release_state "required tag does not exist"
          tag_sha=$(git rev-parse "$TAG^{commit}")
          if [[ "$EVENT_NAME" == "push" ]]; then
            [[ "$tag_sha" == "$TARGET_SHA" ]] || fail_release_state "pushed tag commit mismatch"
          else
            git merge-base --is-ancestor "$tag_sha" "$TARGET_SHA" ||
              fail_release_state "release tag is not an ancestor of the workflow commit"
          fi

          if release_json=$(gh api "repos/$REPO/releases/tags/$TAG" 2>/dev/null); then
            verify_release "$release_json"
            echo "Publish result: already_published_verified"
            exit 0
          fi
          set +e
          query_response=$(gh api \
            --include \
            "repos/$REPO/releases/tags/$TAG" 2>/dev/null)
          query_exit=$?
          set -e
          http_status=$(awk 'NR == 1 { print $2 }' <<<"$query_response")
          [[ "$query_exit" -ne 0 && "$http_status" == "404" ]] ||
            fail_release_state "release query failed with HTTP ${http_status:-unknown}"

          gh release create "$TAG" \
            --repo "$REPO" \
            --verify-tag \
            --draft \
            --prerelease \
            --title "$expected_name" \
            --notes-file release-assets/RELEASE_NOTES.md

          gh release upload "$TAG" \
            "release-assets/AgentBell-Setup-${TAG#v}.exe" \
            "release-assets/AgentBell-Android-${TAG#v}.apk" \
            release-assets/SHA256SUMS.txt \
            --repo "$REPO"

          draft_json=$(gh api "repos/$REPO/releases/tags/$TAG")
          [[ "$(jq -r '.draft' <<<"$draft_json")" == "true" ]] ||
            fail_release_state "new release left draft validation unexpectedly"
          verify_asset_names "$draft_json"

          gh release edit "$TAG" \
            --repo "$REPO" \
            --draft=false \
            --prerelease

          published_json=$(gh api "repos/$REPO/releases/tags/$TAG")
          verify_release "$published_json"
          echo "Publish result: published_new_prerelease"
