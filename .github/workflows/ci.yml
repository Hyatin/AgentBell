name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows .NET 10
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Initialize temporary paths
        shell: pwsh
        run: |
          $codexHome = Join-Path $env:RUNNER_TEMP 'agentbell-codex-home'
          $agentBellDataHome = Join-Path $env:RUNNER_TEMP 'agentbell-data-home'

          New-Item -ItemType Directory -Path $codexHome -Force | Out-Null
          New-Item -ItemType Directory -Path $agentBellDataHome -Force | Out-Null

          @(
            "CODEX_HOME=$codexHome"
            "AGENTBELL_DATA_HOME=$agentBellDataHome"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Verify formatting
        run: dotnet format .\AgentBell.sln --verify-no-changes
      - name: Restore
        run: dotnet restore .\AgentBell.sln
      - name: Build Release
        run: dotnet build .\AgentBell.sln -c Release --no-restore
      - name: Test Release
        run: dotnet test .\AgentBell.sln -c Release --no-build

  android:
    name: Android keyless verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
      - name: Setup JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Unit tests and lint
        working-directory: android/AgentBell
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon
